# Backend-Fehlermeldungen (DE) — siehe docs/ERROR-CODES.md
# Auth
AUTH_INVALID_CREDENTIALS=E-Mail oder Passwort ist falsch.
AUTH_TOKEN_EXPIRED=Ihr Token ist abgelaufen. Bitte neu einloggen.
AUTH_TOKEN_INVALID=Authentifizierung fehlgeschlagen.
AUTH_REFRESH_INVALID=Refresh-Token ist ungültig oder wurde widerrufen.
AUTH_REFRESH_EXPIRED=Refresh-Token ist abgelaufen. Bitte neu einloggen.
AUTH_ROLE_INSUFFICIENT=Ihre Rolle reicht für diese Aktion nicht aus.
AUTH_USER_DISABLED=Ihr Konto ist gesperrt.
AUTH_EMAIL_TAKEN=Diese E-Mail-Adresse ist bereits registriert.
AUTH_USERNAME_TAKEN=Dieser Benutzername ist bereits vergeben.
AUTH_SERVICE_TOKEN_INVALID=Bot-Service-Token ist ungültig.

# User
USER_NOT_FOUND=Benutzer nicht gefunden.
USER_PROFILE_INVALID=Profil-Angaben sind ungültig.
USER_LOCALE_UNAVAILABLE=Angeforderte Sprache wird nicht unterstützt.

# Worlds
WORLD_NOT_FOUND=Welt nicht gefunden.
WORLD_NAME_REQUIRED=Weltname muss angegeben werden.
WORLD_SETTINGS_INVALID=Welt-Einstellungen sind ungültig.
WORLD_ACCESS_DENIED=Sie haben keinen Zugriff auf diese Welt.
WORLD_OWNER_REQUIRED=Nur der Besitzer der Welt darf diese Aktion ausführen.
WORLD_MEMBER_ALREADY=Benutzer ist bereits Mitglied dieser Welt.
WORLD_MEMBER_LIMIT=Mitglieder-Limit erreicht.
WORLD_GAME_SYSTEM_INACTIVE=Das referenzierte Regelwerk ist deaktiviert.

# Entities
ENTITY_NOT_FOUND=Entity nicht gefunden.
ENTITY_TYPE_INVALID=Unbekannter Entity-Typ.
ENTITY_ATTRIBUTES_INVALID=Attribute passen nicht zum Welt-Regelwerk.
ENTITY_POSITION_INVALID=Position liegt außerhalb der Karte oder ist belegt.
ENTITY_FACTION_NOT_FOUND=Referenzierte Fraktion existiert nicht.

# Game Systems
GAME_SYSTEM_NOT_FOUND=Regelwerk nicht gefunden.
GAME_SYSTEM_SCHEMA_INVALID=Regelwerk ist nicht schema-konform.
GAME_SYSTEM_ATTRIBUTE_REF_INVALID=Skill oder Würfel-Expression referenziert unbekanntes Attribut.
GAME_SYSTEM_EXPRESSION_INVALID=Würfel-Expression ist syntaktisch ungültig.
GAME_SYSTEM_VERSION_CONFLICT=Versionsnummer kollidiert mit bestehendem Regelwerk.

# Inventory
INVENTORY_ITEM_NOT_FOUND=Item nicht gefunden.
INVENTORY_INSUFFICIENT_QUANTITY=Anzahl im Inventar reicht nicht aus.
INVENTORY_SLOT_OCCUPIED=Ausrüstungs-Slot ist bereits belegt.
INVENTORY_ITEM_TYPE_INVALID=Item-Typ passt nicht zum Slot.
INVENTORY_WEIGHT_EXCEEDED=Gewichtslimit überschritten.
INVENTORY_EQUIP_NOT_IN_INVENTORY=Item ist nicht im Inventar des Charakters.

# Rolls
ROLL_EXPRESSION_INVALID=Ausdruck konnte nicht geparsed werden.
ROLL_ATTRIBUTE_NOT_FOUND=Referenziertes Attribut existiert am Charakter nicht.
ROLL_ENTITY_NOT_CHARACTER=Diese Entity kann keine Probe ablegen.
ROLL_TARGET_REQUIRED=Diese Probe benötigt einen Ziel-Wert.

# Combat
COMBAT_NOT_FOUND=Kampf-Session nicht gefunden.
COMBAT_NOT_ACTIVE=Kampf ist bereits beendet.
COMBAT_NOT_YOUR_TURN=Sie sind nicht der aktuelle Zug-Inhaber.
COMBAT_AP_INSUFFICIENT=Nicht genug Aktionspunkte.
COMBAT_RANGE_INVALID=Ziel außerhalb der Waffenreichweite.
COMBAT_LINE_OF_SIGHT_BLOCKED=Sichtlinie ist blockiert.
COMBAT_TARGET_INVALID=Ziel-Entity ist ungültig.
COMBAT_ACTION_TYPE_INVALID=Unbekannter Aktionstyp.

# Adventures
ADVENTURE_NOT_FOUND=Abenteuer nicht gefunden.
ADVENTURE_NODE_NOT_FOUND=Abenteuer-Knoten nicht gefunden.
ADVENTURE_CHOICE_NOT_FOUND=Auswahlmöglichkeit nicht gefunden.
ADVENTURE_PROGRESS_NOT_FOUND=Kein aktiver Fortschritt für diesen Charakter.
ADVENTURE_ALREADY_COMPLETED=Abenteuer bereits abgeschlossen.
ADVENTURE_NODE_TERMINAL=Dieser Knoten hat keine weiteren Auswahlmöglichkeiten.

# NPC Intents
INTENT_NOT_FOUND=Intent nicht gefunden.
INTENT_TYPE_INVALID=Unbekannter Intent-Typ.
INTENT_PARAMS_INVALID=Intent-Parameter sind fehlerhaft.
INTENT_VALIDATION_RULE=Regelverletzung: Aktion ist regeltechnisch nicht erlaubt.
INTENT_VALIDATION_VISIBILITY=Sicht verdeckt: Aktion kann nicht ausgeführt werden.
INTENT_VALIDATION_RANGE=Außerhalb Reichweite.
INTENT_VALIDATION_RESOURCE=Ressource fehlt (Item / HP / AP).
INTENT_ALREADY_PROCESSED=Intent wurde bereits abschließend bearbeitet.
INTENT_APPROVAL_REQUIRED=Welt ist im Suggest-Modus, DM-Freigabe fehlt.
INTENT_REJECTED_BY_DM=DM hat den Intent abgelehnt.

# Events
EVENT_NOT_FOUND=Event nicht gefunden.
EVENT_SINCE_INVALID=since-Parameter ist ungültig.
EVENT_RATE_LIMIT=Anfrage-Rate überschritten.

# Time
TIME_MODE_INVALID=Unbekannter Zeit-Modus.
TIME_ADVANCE_INVALID=Advance-Wert ist ungültig.
TIME_SET_INVALID=Ziel-Zeitangabe ist ungültig.
TIME_CALENDAR_INVALID=Kalender-System wird nicht unterstützt.
TIME_PAUSED=Operation nicht möglich, die Zeit ist pausiert.
TIME_NOT_PAUSED=Resume aufgerufen, aber Zeit läuft bereits.
TIME_DM_OVERRIDE_REQUIRED=Automatisches Advance im manuellen Modus ist verboten.

# Admin
ADMIN_TARGET_SELF=Admin darf sich nicht selbst sperren.
ADMIN_DEMOTE_LAST=Letzter Admin kann nicht herabgestuft werden.
ADMIN_BOT_NOT_FOUND=Bot-Instanz für diese Welt nicht gefunden.

# i18n
I18N_LOCALE_UNAVAILABLE=Angeforderte Sprache wird nicht unterstützt.

# System
SYSTEM_INTERNAL_ERROR=Ein unerwarteter Fehler ist aufgetreten.
SYSTEM_DATABASE_UNAVAILABLE=Datenbank ist nicht erreichbar.
SYSTEM_LLM_UNAVAILABLE=LLM ist nicht erreichbar.
SYSTEM_DEPENDENT_SERVICE_DOWN=Abhängiger Service ist nicht erreichbar.

# WebSocket
WS_CONNECT_FAILED=WebSocket-Verbindung fehlgeschlagen.
WS_AUTH_REQUIRED=STOMP CONNECT ohne Authorization-Header.
WS_TOPIC_FORBIDDEN=User darf dieses Topic nicht abonnieren.
WS_PAYLOAD_INVALID=STOMP-Frame konnte nicht geparsed werden.