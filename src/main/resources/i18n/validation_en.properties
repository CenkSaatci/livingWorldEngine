# Bean validation messages (EN) — for @NotNull, @NotBlank, etc.
jakarta.validation.constraints.NotNull.message=must not be null.
jakarta.validation.constraints.NotBlank.message=must not be blank.
jakarta.validation.constraints.NotEmpty.message=must not be empty.
jakarta.validation.constraints.Size.message=must be between {min} and {max} characters long.
jakarta.validation.constraints.Min.message=must be at least {value}.
jakarta.validation.constraints.Max.message=must be at most {value}.
jakarta.validation.constraints.Email.message=must be a valid email address.
jakarta.validation.constraints.Pattern.message=must match the pattern "{regexp}".