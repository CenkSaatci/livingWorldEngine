spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: lwe-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lwe}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  messages:
    basename: i18n/messages,i18n/validation
    encoding: UTF-8
    fallback-to-system-locale: false
  websocket:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

lwe:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-please-32-chars-minimum-xxx}
    access-token-expiration-hours: ${JWT_EXPIRATION_HOURS:24}
    refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  time:
    tick-check-interval-ms: 1000

logging:
  level:
    com.lwe: DEBUG
    org.hibernate.SQL: WARN