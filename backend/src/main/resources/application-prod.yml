# Produktionsprofil — aktiv via SPRING_PROFILES_ACTIVE=prod
spring:
  flyway:
    # In prod niemals still auf eine fremde/lebende DB baselinen — lieber laut failen.
    baseline-on-migrate: false
  jpa:
    show-sql: false
  devtools:
    restart:
      enabled: false
    livereload:
      enabled: false

lwe:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://example.com}

logging:
  level:
    com.lwe: INFO
    org.springframework: WARN
