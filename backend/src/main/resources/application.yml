spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: lwe-backend
  cache:
    type: simple
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lwe}
    username: ${DB_USER:admin}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  messages:
    basename: i18n/messages,i18n/validation
    encoding: UTF-8
    fallback-to-system-locale: false
  websocket:
    enabled: true

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      show-components: always

lwe:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-me-please-32-chars-minimum-xxx}
    access-token-expiration-hours: ${JWT_EXPIRATION_HOURS:24}
    refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}
  cors:
    # Beide Dev-Hosts freigeben: Vite läuft je nach Aufruf unter localhost oder 127.0.0.1.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  time:
    tick-check-interval-ms: 1000
  rate-limit:
    default-max: 1000
    default-window-seconds: 60
    paths:
      - pattern: /api/v1/auth/login
        max: 5
        window-seconds: 900
      - pattern: /api/v1/auth/register
        max: 3
        window-seconds: 3600
      - pattern: /api/v1/worlds
        method: POST
        max: 5
        window-seconds: 60
      - pattern: /api/v1/combat/*/action
        max: 30
        window-seconds: 60
      - pattern: /api/v1/chat/*
        max: 20
        window-seconds: 60
      - pattern: /api/v1/worlds/*/regions
        max: 2000
        window-seconds: 60
      - pattern: /api/v1/npc-intents
        max: 600
        window-seconds: 60
      - pattern: /api/v1/worlds/*/sessions
        max: 600
        window-seconds: 60

logging:
  level:
    com.lwe: DEBUG
    org.hibernate.SQL: WARN