# Backend error messages (EN) — see docs/ERROR-CODES.md
# Auth
AUTH_INVALID_CREDENTIALS=Email or password is incorrect.
AUTH_TOKEN_EXPIRED=Your token has expired. Please log in again.
AUTH_TOKEN_INVALID=Authentication failed.
AUTH_REFRESH_INVALID=Refresh token is invalid or has been revoked.
AUTH_REFRESH_EXPIRED=Refresh token has expired. Please log in again.
AUTH_ROLE_INSUFFICIENT=Your role is not sufficient for this action.
AUTH_USER_DISABLED=Your account is locked.
AUTH_EMAIL_TAKEN=This email address is already registered.
AUTH_USERNAME_TAKEN=This username is already in use.
AUTH_SERVICE_TOKEN_INVALID=Bot service token is invalid.

# User
USER_NOT_FOUND=User not found.
USER_PROFILE_INVALID=Profile data is invalid.
USER_LOCALE_UNAVAILABLE=Requested locale is not supported.

# Worlds
WORLD_NOT_FOUND=World not found.
WORLD_NAME_REQUIRED=World name is required.
WORLD_SETTINGS_INVALID=World settings are invalid.
WORLD_ACCESS_DENIED=You do not have access to this world.
WORLD_OWNER_REQUIRED=Only the world owner may perform this action.
WORLD_MEMBER_ALREADY=User is already a member of this world.
WORLD_MEMBER_LIMIT=Member limit reached.
WORLD_GAME_SYSTEM_INACTIVE=The referenced game system is inactive.

# Entities
ENTITY_NOT_FOUND=Entity not found.
ENTITY_TYPE_INVALID=Unknown entity type.
ENTITY_ATTRIBUTES_INVALID=Attributes do not match the world's rule system.
ENTITY_POSITION_INVALID=Position is outside the map or occupied.
ENTITY_FACTION_NOT_FOUND=Referenced faction does not exist.

# Game Systems
GAME_SYSTEM_NOT_FOUND=Game system not found.
GAME_SYSTEM_SCHEMA_INVALID=Game system JSON is not schema-compliant.
GAME_SYSTEM_ATTRIBUTE_REF_INVALID=Skill or dice expression references unknown attribute.
GAME_SYSTEM_EXPRESSION_INVALID=Dice expression is syntactically invalid.
GAME_SYSTEM_VERSION_CONFLICT=Version conflicts with an existing game system.

# Inventory
INVENTORY_ITEM_NOT_FOUND=Item not found.
INVENTORY_INSUFFICIENT_QUANTITY=Quantity in inventory is insufficient.
INVENTORY_SLOT_OCCUPIED=Equipment slot is already occupied.
INVENTORY_ITEM_TYPE_INVALID=Item type does not match slot.
INVENTORY_WEIGHT_EXCEEDED=Weight limit exceeded.
INVENTORY_EQUIP_NOT_IN_INVENTORY=Item is not in the character's inventory.

# Rolls
ROLL_EXPRESSION_INVALID=Expression could not be parsed.
ROLL_ATTRIBUTE_NOT_FOUND=Referenced attribute does not exist on the character.
ROLL_ENTITY_NOT_CHARACTER=This entity cannot perform rolls.
ROLL_TARGET_REQUIRED=This roll requires a target value.

# Combat
COMBAT_NOT_FOUND=Combat session not found.
COMBAT_NOT_ACTIVE=Combat has already ended.
COMBAT_NOT_YOUR_TURN=You are not the current turn owner.
COMBAT_AP_INSUFFICIENT=Not enough action points.
COMBAT_RANGE_INVALID=Target is out of weapon range.
COMBAT_LINE_OF_SIGHT_BLOCKED=Line of sight is blocked.
COMBAT_TARGET_INVALID=Target entity is invalid.
COMBAT_ACTION_TYPE_INVALID=Unknown action type.

# Adventures
ADVENTURE_NOT_FOUND=Adventure not found.
ADVENTURE_NODE_NOT_FOUND=Adventure node not found.
ADVENTURE_CHOICE_NOT_FOUND=Choice not found.
ADVENTURE_PROGRESS_NOT_FOUND=No active progress for this character.
ADVENTURE_ALREADY_COMPLETED=Adventure already completed.
ADVENTURE_NODE_TERMINAL=This node has no further choices.

# NPC Intents
INTENT_NOT_FOUND=Intent not found.
INTENT_TYPE_INVALID=Unknown intent type.
INTENT_PARAMS_INVALID=Intent parameters are invalid.
INTENT_VALIDATION_RULE=Rule violation: action is not allowed by game rules.
INTENT_VALIDATION_VISIBILITY=Visibility blocked: action cannot be executed.
INTENT_VALIDATION_RANGE=Out of range.
INTENT_VALIDATION_RESOURCE=Missing resource (item / HP / AP).
INTENT_ALREADY_PROCESSED=Intent has already been processed.
INTENT_APPROVAL_REQUIRED=World is in suggest mode, DM approval missing.
INTENT_REJECTED_BY_DM=DM rejected the intent.

# Events
EVENT_NOT_FOUND=Event not found.
EVENT_SINCE_INVALID=since parameter is invalid.
EVENT_RATE_LIMIT=Request rate exceeded.

# Time
TIME_MODE_INVALID=Unknown time mode.
TIME_ADVANCE_INVALID=Advance value is invalid.
TIME_SET_INVALID=Target time is invalid.
TIME_CALENDAR_INVALID=Calendar system is not supported.
TIME_PAUSED=Operation not possible, time is paused.
TIME_NOT_PAUSED=Resume called but time is already running.
TIME_DM_OVERRIDE_REQUIRED=Automatic advance in manual mode is forbidden.

# Admin
ADMIN_TARGET_SELF=Admin cannot lock themselves.
ADMIN_DEMOTE_LAST=Last admin cannot be demoted.
ADMIN_BOT_NOT_FOUND=Bot instance for this world not found.

# i18n
I18N_LOCALE_UNAVAILABLE=Requested locale is not supported.

# System
SYSTEM_INTERNAL_ERROR=An unexpected error occurred.
SYSTEM_DATABASE_UNAVAILABLE=Database is unreachable.
SYSTEM_LLM_UNAVAILABLE=LLM is unreachable.
SYSTEM_DEPENDENT_SERVICE_DOWN=Dependent service is unreachable.

# WebSocket
WS_CONNECT_FAILED=WebSocket connection failed.
WS_AUTH_REQUIRED=STOMP CONNECT without Authorization header.
WS_TOPIC_FORBIDDEN=User may not subscribe to this topic.
WS_PAYLOAD_INVALID=STOMP frame could not be parsed.