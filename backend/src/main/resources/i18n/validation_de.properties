# Bean-Validation-Nachrichten (DE) — für @NotNull, @NotBlank, etc.
jakarta.validation.constraints.NotNull.message=darf nicht null sein.
jakarta.validation.constraints.NotBlank.message=darf nicht leer sein.
jakarta.validation.constraints.NotEmpty.message=darf nicht leer sein.
jakarta.validation.constraints.Size.message=muss zwischen {min} und {max} Zeichen lang sein.
jakarta.validation.constraints.Min.message=muss mindestens {value} sein.
jakarta.validation.constraints.Max.message=darf höchstens {value} sein.
jakarta.validation.constraints.Email.message=muss eine gültige E-Mail-Adresse sein.
jakarta.validation.constraints.Pattern.message=muss dem Muster "{regexp}" entsprechen.