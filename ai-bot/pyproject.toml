[project]
name = "lwe-ai-bot"
version = "0.1.0"
description = "Living World Engine — AI Bot Service"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "jinja2>=3.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]

[tool.ruff]
line-length = 100
target-version = "py312"
