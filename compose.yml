# ============================================================
# compose.yml — Development Setup (Podman-kompatibel)
# Siehe docs/ADR/006-container-runtime-podman.md
# ============================================================

services:
  ai-bot:
    build:
      context: ai-bot
      dockerfile: Containerfile
    environment:
      AI_BOT_BACKEND_URL: ${AI_BOT_BACKEND_URL:-http://192.168.31.151:8080/api/v1}
      AI_BOT_LLM_TYPE: ${AI_BOT_LLM_TYPE:-ollama}
      AI_BOT_OLLAMA_URL: ${AI_BOT_OLLAMA_URL:-http://192.168.31.151:11434}
      AI_BOT_OLLAMA_MODEL: ${AI_BOT_OLLAMA_MODEL:-llama3}
    ports:
      - "8000:8000"
